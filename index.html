<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legend of ToneDa</title><style>body{margin:0;overflow:hidden;background:#12121b;color:white;font-family:Georgia}#ui{position:fixed;top:12px;left:12px;text-shadow:2px 2px black}#box{position:fixed;bottom:45px;left:50%;transform:translateX(-50%);width:min(680px,85vw);padding:20px;background:#121019ed;border:4px ridge gold;display:none}#start{position:fixed;inset:0;background:radial-gradient(#7a1b28,#090a11);display:grid;place-content:center;text-align:center}h1{color:gold;font-size:clamp(30px,6vw,70px);margin:0}button{background:#9c172c;color:white;border:2px solid gold;padding:15px;font-size:20px;cursor:pointer}#mobile{position:fixed;bottom:10px;display:flex;gap:5px;width:100%;justify-content:space-around}#mobile button{font-size:13px;padding:8px}@media(pointer:fine){#mobile{display:none}}</style></head><body><div id="ui">♥ ♥ ♥ ♥ ♥<p id="quest">QUEST: Speak to the Great Trap Tree</p><p id="kills">Opps: 0/3</p><small>WASD move • SPACE jump • J attack • F pulse • E talk • T transform • Drag to rotate</small></div><div id="box"><b id="who" style="color:#f55">NIGGY</b><p id="words"></p><small>Press E to continue</small></div><div id="start"><h1>THE LEGEND OF TONEDA</h1><h2 style="color:#f55">GLOCKNINA OF TIME</h2><p>TRAP VILLAGE • N64-STYLE PLAYABLE PROTOTYPE</p><button id="play">START GAME</button><p>From YN to OG • Type shit</p></div><div id="mobile"><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="s">▼</button><button data-k="d">▶</button><button data-a="jump">JUMP</button><button data-a="hit">HIT</button><button data-a="talk">TALK</button></div><script type="module">import * as T from 'https://esm.sh/three@0.170.0';const s=new T.Scene();s.background=new T.Color('#7cb5d6');s.fog=new T.Fog('#7cb5d6',35,85);const c=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,200),r=new T.WebGLRenderer({antialias:false});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.4));document.body.prepend(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x455d40,2.7));const light=new T.DirectionalLight(0xffe2b2,2);light.position.set(12,25,9);s.add(light);const m=x=>new T.MeshLambertMaterial({color:x,flatShading:true}),brown=m('#70472f'),leaf=m('#34763b'),red=m('#9e182b'),black=m('#1a1b24'),skin=m('#75462f'),gold=m('#e3b455');function shape(g,mt,x,y,z,p=s){const a=new T.Mesh(g,mt);a.position.set(x,y,z);p.add(a);return a}function cube(w,h,d,mt,x,y,z,p=s){return shape(new T.BoxGeometry(w,h,d),mt,x,y,z,p)}function ball(rad,mt,x,y,z,p=s){return shape(new T.SphereGeometry(rad,8,6),mt,x,y,z,p)}function trunk(rad,h,mt,x,y,z,p=s){return shape(new T.CylinderGeometry(rad*.8,rad,h,8),mt,x,y,z,p)}const floor=shape(new T.PlaneGeometry(160,160),m('#568b44'),0,0,0);floor.rotation.x=-Math.PI/2;for(let i=0;i<65;i++){const a=i*2.4,d=15+Math.sqrt(i)*4,x=Math.cos(a)*d,z=Math.sin(a)*d;trunk(.45,4,brown,x,2,z);ball(2.6,leaf,x,5,z)}const house=new T.Group();house.position.set(-8,0,-7);s.add(house);for(const x of [-2,2])for(const z of [-2,2])trunk(.3,5,brown,x,2.5,z,house);cube(6,.4,6,brown,0,5,0,house);cube(5,3,4,m('#ad7949'),0,6.7,0,house);const roof=shape(new T.ConeGeometry(4.2,2.5,4),red,0,9.3,0,house);roof.rotation.y=Math.PI/4;const canvas=document.createElement('canvas');canvas.width=256;canvas.height=80;const ct=canvas.getContext('2d');ct.fillStyle='#ff2525';ct.font='bold 70px monospace';ct.fillText('TRAP',25,65);shape(new T.PlaneGeometry(3.5,1),new T.MeshBasicMaterial({map:new T.CanvasTexture(canvas),transparent:true}),0,7,2.05,house);const tree=new T.Group();tree.position.set(10,0,-10);s.add(tree);trunk(3,13,brown,0,6.5,0,tree);for(let i=0;i<6;i++)ball(4,leaf,Math.sin(i*2.4)*3,13,Math.cos(i*2.4)*3,tree);ball(.5,black,-.9,7,2.5,tree);ball(.5,black,.9,7,2.5,tree);cube(1.8,.25,.4,black,0,5.5,2.7,tree);const p=new T.Group();s.add(p);cube(.85,1,.5,black,0,1.6,0,p);ball(.4,skin,0,2.45,0,p);shape(new T.ConeGeometry(.5,1.2,7),red,0,3.02,-.15,p);for(let i=0;i<6;i++)cube(.08,.6,.1,i%2?red:black,(i-2.5)*.12,2.15,.32,p);for(const x of [-.27,.27]){cube(.3,.85,.3,black,x,.65,0,p);cube(.4,.3,.6,m('#b48b48'),x,.18,.1,p)}cube(.7,.16,.14,black,0,2.48,.37,p);const shield=shape(new T.CylinderGeometry(.52,.52,.12,12),gold,-.6,1.5,.1,p);shield.rotation.z=Math.PI/2;const demon=new T.Group();s.add(demon);ball(.27,red,0,0,0,demon);for(const x of [-.4,.4]){const wing=shape(new T.ConeGeometry(.3,.7,3),red,x,.15,0,demon);wing.rotation.z=x<0?-.8:.8}const enemies=[];for(let i=0;i<3;i++){const e=new T.Group();e.position.set(5+i*3,0,4+i*2);s.add(e);trunk(.4,1.4,brown,0,.8,0,e);ball(.75,i%2?brown:leaf,0,1.8,0,e);for(const x of [-.35,.35])cube(.12,.7,.12,brown,x,.4,0,e);enemies.push({e,hp:3})}const keys=new Set();let active=false,og=false,jump=0,velocity=0,yaw=0,dialog=[],index=0,open=false,kills=0;const panel=document.getElementById('box'),words=document.getElementById('words');function say(lines,who='NIGGY'){dialog=lines;index=0;open=true;panel.style.display='block';document.getElementById('who').textContent=who;line()}let timer;function line(){clearInterval(timer);words.textContent='';let n=0;timer=setInterval(()=>{words.textContent=dialog[index].slice(0,++n);if(n>=dialog[index].length)clearInterval(timer)},25)}function talk(){if(open){clearInterval(timer);if(words.textContent.length<dialog[index].length){words.textContent=dialog[index];return}if(++index<dialog.length)line();else{open=false;panel.style.display='none'}return}if(p.position.distanceTo(tree.position)<8)say(['Young ToneDa, the rhythm of time is missing.','Defeat the Opps and protect Trap Village.'],'GREAT TRAP TREE');else say(['Ayy, listen!','My name Niggy, and I’m a demon. Ain’t no fairy shit going on over here, gang. Type shit.'])}function hit(){for(const o of enemies){if(o.hp>0&&o.e.position.distanceTo(p.position)<3){if(--o.hp===0){s.remove(o.e);kills++;document.getElementById('kills').textContent='Opps: '+kills+'/3';if(kills===3)say(['We got all the Opps, gang. Type shit.'])}}}}function action(a){if(a==='talk')talk();if(a==='hit')hit();if(a==='jump'&&jump===0)velocity=7}addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space')e.preventDefault();if(!active||e.repeat)return;if(e.key.toLowerCase()==='e'||e.key==='Enter')talk();if('jkf'.includes(e.key.toLowerCase()))hit();if(e.code==='Space')action('jump');if(e.key.toLowerCase()==='t'){og=!og;p.scale.setScalar(og?1.4:1);say([og?'From YN to OG! Type shit.':'Back to YN. Type shit.'])}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));for(const b of document.querySelectorAll('[data-k]')){b.onpointerdown=()=>keys.add(b.dataset.k);b.onpointerup=()=>keys.delete(b.dataset.k)}for(const b of document.querySelectorAll('[data-a]'))b.onclick=()=>action(b.dataset.a);document.getElementById('play').onclick=()=>{active=true;document.getElementById('start').remove();say(['Ayy, listen!','My name Niggy, and I’m a demon. Ain’t no fairy shit going on over here, gang. Type shit.'])};let drag=false,px=0;r.domElement.onpointerdown=e=>{drag=true;px=e.clientX};addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-px)*.006;px=e.clientX}});const clock=new T.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(active){if(!open){let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),z=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(x||z){const a=Math.atan2(x,z)+yaw;p.position.x+=Math.sin(a)*dt*6;p.position.z+=Math.cos(a)*dt*6;p.rotation.y=a}}velocity-=18*dt;jump=Math.max(0,jump+velocity*dt);if(jump===0)velocity=0;p.position.y=jump;demon.position.set(p.position.x+1.1,p.position.y+2.6+Math.sin(clock.elapsedTime*4)*.15,p.position.z+.6);c.position.lerp(new T.Vector3(p.position.x-Math.sin(yaw)*9,p.position.y+5,p.position.z-Math.cos(yaw)*9),.1);c.lookAt(p.position.x,p.position.y+1.5,p.position.z)}else{c.position.set(16,12,18);c.lookAt(0,3,0)}r.render(s,c)}frame();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
