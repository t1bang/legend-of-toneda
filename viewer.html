<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToneDa Model Viewer</title>
<style>
  body{margin:0;overflow:hidden;background:#12121b;color:#fff;font-family:Georgia,serif}
  #bar{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;flex-wrap:wrap;gap:6px;background:#121019cc}
  #bar b{color:gold;margin-right:8px;align-self:center}
  button{background:#9c172c;color:#fff;border:2px solid gold;padding:7px 11px;font-size:14px;cursor:pointer;font-family:inherit}
  button.on{background:gold;color:#1a1014}
  #hint{position:fixed;bottom:10px;left:12px;opacity:.75;font-size:13px}
</style>
</head>
<body>
<div id="bar"><b>TONEDA MODEL VIEWER</b><span id="forms"></span><span id="clips"></span><b style="margin-left:8px">NIGGY</b><span id="moods"></span></div>
<div id="hint">Drag to rotate • scroll to zoom • pick a form and an animation above</div>
<script type="module">
import * as T from './vendor/three.module.min.js';
import { ToneDa } from './src/character/toneda.js';
import { ONE_SHOTS } from './src/character/anims.js';
import { Niggy, EXPRESSIONS } from './src/character/niggy.js';

const scene = new T.Scene();
scene.background = new T.Color('#7cb5d6');
scene.fog = new T.Fog('#7cb5d6', 30, 80);
const camera = new T.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
const renderer = new T.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.4));
document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff, 0x455d40, 2.7));
const sun = new T.DirectionalLight(0xffe2b2, 2);
sun.position.set(12, 25, 9);
scene.add(sun);
const ground = new T.Mesh(new T.CircleGeometry(14, 24), new T.MeshLambertMaterial({ color: '#568b44' }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const toneda = new ToneDa();
scene.add(toneda.root);
const niggy = new Niggy();
scene.add(niggy.root);
const niggySpot = new T.Vector3();

const view = { yaw: 0.5, pitch: 0.18, dist: 7.5, loop: 'idle', paused: false };
const state = () => ({
  moving: ['walk', 'run', 'sprint'].includes(view.loop), walk: view.loop === 'walk', sprint: view.loop === 'sprint',
  grounded: !['jump', 'fall'].includes(view.loop), vy: view.loop === 'jump' ? 1 : -1,
});

const forms = document.getElementById('forms'), clips = document.getElementById('clips');
function buttons() {
  forms.innerHTML = ''; clips.innerHTML = '';
  for (const v of ['yn', 'og']) {
    const b = document.createElement('button');
    b.textContent = v === 'yn' ? 'YN ToneDa' : 'OG ToneDa';
    b.className = toneda.variant === v ? 'on' : '';
    b.onclick = () => { toneda.setVariant(v); buttons(); };
    forms.append(b, ' ');
  }
  for (const name of toneda.clipNames) {
    const b = document.createElement('button');
    b.textContent = name;
    b.className = view.loop === name ? 'on' : '';
    b.onclick = () => select(name);
    clips.append(b, ' ');
  }
}
function select(name) {
  toneda.release();
  if (name === 'transform') toneda.transform(toneda.variant === 'yn');
  else if (ONE_SHOTS.has(name)) toneda.play(name);
  else {
    view.loop = name;
    if (name === 'block' || name === 'song') toneda.hold(name);
  }
  buttons();
}
buttons();
const moods = document.getElementById('moods');
for (const name of [...EXPRESSIONS, 'spin']) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { if (name === 'spin') niggy.spin(); else { niggy.speak(name === 'talking'); niggy.setExpression(name === 'talking' ? 'idle' : name); } };
  moods.append(b, ' ');
}

let drag = false, px = 0, py = 0;
renderer.domElement.onpointerdown = e => { drag = true; px = e.clientX; py = e.clientY; };
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => {
  if (!drag) return;
  view.yaw -= (e.clientX - px) * 0.008; view.pitch = Math.max(-0.2, Math.min(1.2, view.pitch + (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY;
});
addEventListener('wheel', e => { view.dist = Math.max(3, Math.min(18, view.dist + e.deltaY * 0.01)); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function render() {
  const h = toneda.spec.height * 0.5;
  camera.position.set(Math.sin(view.yaw) * Math.cos(view.pitch) * view.dist, h + Math.sin(view.pitch) * view.dist, Math.cos(view.yaw) * Math.cos(view.pitch) * view.dist);
  camera.lookAt(0, h, 0);
  renderer.render(scene, camera);
}
function step(dt) { toneda.update(dt, state()); niggySpot.set(1.5, toneda.spec.height - 0.3, 0.4); niggy.update(dt, niggySpot, camera); if (toneda.variant !== step.last) { step.last = toneda.variant; buttons(); } render(); }
const clock = new T.Clock();
(function frame() { requestAnimationFrame(frame); const dt = Math.min(clock.getDelta(), 0.05); if (!view.paused) step(dt); })();

// Hooks for automated screenshots.
window.viewer = { toneda, niggy, view, select, step, render, camera, renderer, scene };
</script>
</body>
</html>
